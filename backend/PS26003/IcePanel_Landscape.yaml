# yaml-language-server: $schema=https://api.icepanel.io/v1/schemas/LandscapeImportData
modelObjects:
  - id: domain-health
    name: Healthcare Domain
    type: domain
  - id: sys-cognitive-platform
    name: AI-Powered Cognitive Platform
    type: system
    parentId: domain-health
  - id: app-client
    name: Client-Side (Edge) Application
    type: app
    parentId: sys-cognitive-platform
  - id: store-sqlite
    name: Mobile Local Storage
    type: store
    parentId: sys-cognitive-platform
  - id: store-indexeddb
    name: Web Local Storage
    type: store
    parentId: sys-cognitive-platform
  - id: comp-sync
    name: Background Sync Manager
    type: component
    parentId: app-client
  - id: app-api
    name: API Gateway
    type: app
    parentId: sys-cognitive-platform
  - id: store-cloud-db
    name: Cloud Database
    type: store
    parentId: sys-cognitive-platform
  - id: app-portal
    name: Caregiver Portal
    type: app
    parentId: sys-cognitive-platform
  - id: comp-dda
    name: Dynamic Difficulty Adaptation (MAB Engine)
    type: component
    parentId: app-api
  - id: comp-voice
    name: Voice AI Interface
    type: component
    parentId: app-api
  - id: comp-analytics
    name: Predictive Analytics
    type: component
    parentId: app-api

modelConnections:
  - id: conn-client-sqlite
    originId: app-client
    targetId: store-sqlite
    direction: outgoing
    name: Writes interactions locally
  - id: conn-client-api-pull
    originId: app-client
    targetId: app-api
    direction: outgoing
    name: Fetches asset packages
  - id: conn-sync-api
    originId: comp-sync
    targetId: app-api
    direction: outgoing
    name: Pushes batched JSON payloads
  - id: conn-api-db
    originId: app-api
    targetId: store-cloud-db
    direction: outgoing
    name: Stores logs and metrics
  - id: conn-portal-db
    originId: app-portal
    targetId: store-cloud-db
    direction: bidirectional
    name: Visualizes longitudinal charts
    